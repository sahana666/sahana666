name: Generate Streak Stats
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Generate Streak Stats
        uses: muhammad-fiaz/github-readme-streak-stats@v1.0.1
        with:
          USERNAME: sahana666
          GITHUB_TOKEN: ${{ secrets.STREAK_TOKEN }}
          THEME: tokyonight
          OUTPUT_PATH: streak-stats.svg
